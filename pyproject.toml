[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lirk"
version = "0.1.0"
description = "A minimal, Bazel/Please-inspired build tool for Python monorepos."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shawn Faulkingham Jr" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/socitt/lirk"

[project.scripts]
lirk = "lirk.cli:main"

[tool.setuptools]
packages = ["lirk"]
