[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lirk"
version = "1.1.1"
description = "A small build and test tool for Python monorepos: reruns only what changed, and never reports a stale pass."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shawn Faulkingham Jr" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["build", "build-tool", "monorepo", "bazel", "testing", "incremental"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/socitt/lirk"
Documentation = "https://socitt.github.io/lirk/"
Issues = "https://github.com/socitt/lirk/issues"
Changelog = "https://github.com/socitt/lirk/releases"

[project.scripts]
lirk = "lirk.cli:main"

[tool.setuptools]
packages = ["lirk"]
