<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --bg: #ffffff;
      --muted: #5b5b5b;
      --border: #ddd;
      --code-bg: #f4f4f4;
      --link: #0550ae;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6e6e6;
        --bg: #14161a;
        --muted: #a0a0a0;
        --border: #333;
        --code-bg: #1d1f24;
        --link: #6cb4ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.6;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }
    header .title {
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
      color: var(--fg);
    }
    nav {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.95rem;
    }
    nav a { color: var(--link); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main {
      max-width: 46rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    a { color: var(--link); }
    pre, code {
      background: var(--code-bg);
      border-radius: 4px;
    }
    code { padding: 0.15em 0.35em; font-size: 0.9em; }
    pre { padding: 1rem; overflow-x: auto; }
    pre code { padding: 0; background: none; }
    pre.mermaid { background: none; padding: 0; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
    .lead { font-size: 1.15rem; color: var(--muted); }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 0.75rem;
      margin: 1.25rem 0;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
    }
    .card strong { display: block; margin-bottom: 0.25rem; }
    .card p { margin: 0; font-size: 0.95rem; color: var(--muted); }
    blockquote {
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      border-left: 3px solid var(--link);
      background: var(--code-bg);
      border-radius: 0 4px 4px 0;
    }
    blockquote p { margin: 0.3rem 0; }
    footer {
      max-width: 46rem;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="title" href="{{ '/' | relative_url }}">lirk</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Overview</a>
      <a href="{{ '/getting-started.html' | relative_url }}">Getting started</a>
      <a href="{{ '/adopting.html' | relative_url }}">Existing repos</a>
      <a href="{{ '/build-format.html' | relative_url }}">BUILD files</a>
      <a href="{{ '/commands.html' | relative_url }}">Commands</a>
      <a href="{{ '/how-it-works.html' | relative_url }}">How it works</a>
      <a href="{{ '/troubleshooting.html' | relative_url }}">Troubleshooting</a>
      <a href="https://github.com/socitt/lirk">GitHub</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    lirk 1.0 · MIT licensed ·
    <a href="https://github.com/socitt/lirk">source</a> ·
    <a href="https://github.com/socitt/lirk/issues">report a problem</a>
  </footer>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: true,
      theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default",
    });
  </script>
</body>
</html>
