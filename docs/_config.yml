title: lirk
description: A small build and test tool for Python monorepos that only reruns what changed, and never reports a stale pass.
markdown: kramdown

# Project page (socitt/lirk, not socitt.github.io) -- served under a
# /lirk path prefix, so relative_url needs this to build correct links.
url: "https://socitt.github.io"
baseurl: "/lirk"

# Maintainer docs (dev/) and historical material (archive/) stay in the
# repo, browsable on GitHub, but are not built into the user-facing site.
exclude:
  - dev/
  - archive/
