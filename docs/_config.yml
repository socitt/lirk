title: lirk
description: A minimal, Bazel/Please-inspired build tool for Python monorepos.
markdown: kramdown

# Project page (socitt/lirk, not socitt.github.io) -- served under a
# /lirk path prefix, so relative_url needs this to build correct links.
url: "https://socitt.github.io"
baseurl: "/lirk"

# Internal contributor docs and working logs: not user-facing reference.
# Left in the repo (viewable via normal GitHub browsing) but not built
# into the Pages site or its nav.
exclude:
  - DESIGN.md
  - TASKS.md
  - ACTIVE_SESSION.md
  - KNOWN_ISSUES.md
  - assessments/
  - reviews/
  - design/
